<div class="orders-heading">
  <h3>Item types</h3>

  <div>
    <button matIconButton (click)="refreshItemTypes()" [disabled]="itemTypes.isLoading()">
      <mat-icon>refresh</mat-icon>
    </button>
    <button matIconButton (click)="openCreateItemTypeModal()" [disabled]="itemTypes.isLoading()">
      <mat-icon>add</mat-icon>
    </button>
  </div>
</div>

@if (itemTypes.isLoading() && !itemTypes.hasValue()) {
  <div class="spinner-container">
    <mat-spinner [diameter]="48" />
  </div>
}

@if (itemTypes.error()) {
  <app-info-box>
    <p>An error occurred while loading the available item types:</p>
    <pre>{{ itemTypes.error() | json }}</pre>
  </app-info-box>
}

@if (itemTypes.hasValue()) {
  <app-item-type-table [itemTypes]="itemTypes.value()" (refreshItemTypes)="refreshItemTypes()" />
}
