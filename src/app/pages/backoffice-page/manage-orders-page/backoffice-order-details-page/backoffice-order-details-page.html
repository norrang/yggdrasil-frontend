<main class="page-container">
  @if (orderDetails && orderDetails.hasValue()) {
    <app-order-details
      [orderDetails]="orderDetails.value()"
      [orderView]="OrderView.BACKOFFICE_DETAILS"
      backLink="/backoffice/manage-orders"
      [loadingOrderDetails]="orderDetails.isLoading()"
      (updateStatus)="updateStatus($event)"
      (refreshOrderDetails)="refreshOrderDetails()"
    />
  }
</main>
