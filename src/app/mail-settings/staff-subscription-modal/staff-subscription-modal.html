<h2 mat-dialog-title>
  {{ isEditing ? 'Edit email notifications' : 'Enable email notifications' }}
</h2>

<form [formRoot]="subscriptionForm">
  <mat-dialog-content>
    <mat-form-field>
      <mat-label>Email</mat-label>
      <input matInput type="email" autocomplete="email" [formField]="subscriptionForm.email" />
      <mat-error>{{ subscriptionForm.email().errors()[0]?.message }}</mat-error>
    </mat-form-field>
    <mat-checkbox [formField]="subscriptionForm.newOrders">Notify me about new orders</mat-checkbox>
  </mat-dialog-content>

  <mat-dialog-actions>
    <button
      matButton
      type="button"
      (click)="dialogRef.close(false)"
      [disabled]="subscriptionForm().submitting()"
    >
      Cancel
    </button>
    <button
      matButton="filled"
      type="submit"
      [showProgress]="subscriptionForm().submitting()"
      [disabled]="!subscriptionForm().valid() || subscriptionForm().submitting()"
    >
      {{ isEditing ? 'Save' : 'Enable' }}
      <mat-progress-spinner progressIndicator mode="indeterminate" diameter="20" />
    </button>
  </mat-dialog-actions>
</form>
