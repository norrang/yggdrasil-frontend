<h2 mat-dialog-title>Register new item type</h2>

<mat-dialog-content>
  <app-item-type-form [itemTypeForm]="itemTypeForm" />
</mat-dialog-content>

<mat-dialog-actions>
  <div>
    <button matButton (click)="dialogRef.close(false)">Cancel</button>
    <button
      matButton="filled"
      (click)="createItemType()"
      [showProgress]="itemTypeForm().submitting()"
      [disabled]="!itemTypeForm().valid() || itemTypeForm().submitting()"
    >
      Update
      <mat-progress-spinner progressIndicator mode="indeterminate" diameter="20" />
    </button>
  </div>
</mat-dialog-actions>
