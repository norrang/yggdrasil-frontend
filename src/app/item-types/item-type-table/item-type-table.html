<table mat-table [dataSource]="itemTypes()">
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let element">{{ element.name }}</td>
  </ng-container>

  <ng-container matColumnDef="imageUrl">
    <th mat-header-cell *matHeaderCellDef>Image URL</th>
    <td mat-cell *matCellDef="let element">{{ element.imageUrl }}</td>
  </ng-container>

  <ng-container matColumnDef="quantityType">
    <th mat-header-cell *matHeaderCellDef>Quantity type</th>
    <td mat-cell *matCellDef="let element">{{ element.quantityType }}</td>
  </ng-container>

  <ng-container matColumnDef="enabled">
    <th mat-header-cell *matHeaderCellDef>Enabled</th>
    <td mat-cell *matCellDef="let element">{{ element.enabled }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr
    mat-row
    *matRowDef="let row; columns: displayedColumns"
    (click)="openUpdateItemTypeModal(row.id)"
  ></tr>

  <tr *matNoDataRow>
    <td colspan="7">There are currently no registered item types</td>
  </tr>
</table>
