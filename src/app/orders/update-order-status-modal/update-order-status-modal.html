<h2 mat-dialog-title>Update order status</h2>

<form [formRoot]="updateOrderStatusForm">
  <mat-dialog-content>
    <mat-form-field>
      <mat-label>New status</mat-label>
      <mat-select [formField]="updateOrderStatusForm.orderStatus">
        @for (orderStatus of orderStatuses; track $index) {
          <mat-option [value]="orderStatus">{{ orderStatus }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions>
    <button matButton (click)="this.dialogRef.close(false)" type="button">Cancel</button>
    <button
      matButton="filled"
      type="submit"
      [disabled]="updateOrderStatusForm().submitting()"
      [showProgress]="updateOrderStatusForm().submitting()"
    >
      Update
      <mat-progress-spinner progressIndicator mode="indeterminate" diameter="20" />
    </button>
  </mat-dialog-actions>
</form>
